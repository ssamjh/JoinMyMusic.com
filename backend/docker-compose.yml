services:
  backend:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data  # SQLite DB
    # Reach the TidaLuna bridge running on the Windows host. Built in on Docker
    # Desktop; only strictly required on Linux Docker Engine, but declared here
    # so the host dependency is explicit.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The bridge plugin binds 0.0.0.0 so the container can reach it — a
      # 127.0.0.1 bind is NOT reachable via host.docker.internal.
      TIDAL_BRIDGE_URL: "http://host.docker.internal:24124"
      AUTH_KEY: "change_me"
      TURNSTILE_SECRET: ""
      TURNSTILE_SITE_KEY: ""
      DB_FILE: "/data/music_sync.db"
      PORT: "8080"
      METADATA_DELAY: "5"
    # App exits within a couple seconds on SIGTERM; keep grace short as a backstop.
    stop_grace_period: 5s
    stop_signal: SIGTERM
    restart: unless-stopped
