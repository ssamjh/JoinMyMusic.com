services:
  backend:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data  # SQLite DB + Spotify token cache
    environment:
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      SPOTIFY_DEVICE_NAME: ""
      SPOTIFY_REDIRECT_URI: "https://api.joinmymusic.com/api/callback"
      ALLOWED_ORIGINS: "https://joinmymusic.com,https://www.joinmymusic.com"
      AUTH_KEY: "change_me"
      TURNSTILE_SECRET: ""
      TURNSTILE_SITE_KEY: ""
      TOKEN_CACHE_FILE: "/data/token_cache.json"
      DB_FILE: "/data/music_sync.db"
      PORT: "8080"
      METADATA_DELAY: "5"
    # App exits within a couple seconds on SIGTERM; keep grace short as a backstop.
    stop_grace_period: 5s
    stop_signal: SIGTERM
    restart: unless-stopped
